<!doctype html>
<html dir="rtl" lang="he"><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    position: relative;
    background: #F5F5F5;                              /* @color/background_color */
    font-family: "SF Hebrew", "Arial Hebrew", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  /* Soft brand-colour shapes in the corners, away from the centre content. */
  .blob { position: absolute; border-radius: 50%; filter: blur(2px); }
  .b1 { width: 420px; height: 420px; right: -150px; top: -190px; background: #449799; opacity: .16; }
  .b2 { width: 300px; height: 300px; left: -110px; bottom: -150px; background: #449799; opacity: .12; }
  .b3 { width: 140px; height: 140px; left: 120px; top: -60px; background: #B94B55; opacity: .10; }
  .b4 { width: 90px;  height: 90px;  right: 150px; bottom: -30px; background: #B94B55; opacity: .10; }
  /* The logo card from the main screen (MaterialCardView, 12dp corners, elevation). */
  .card {
    position: relative;
    background: #FFF8F6;                              /* @color/card_unified_background */
    border-radius: 18px;
    padding: 22px 36px;
    box-shadow: 0 10px 28px rgba(0,0,0,.14), 0 2px 6px rgba(0,0,0,.08);
  }
  .card img { width: 430px; display: block; }
  h1 {
    position: relative; margin: 18px 0 0; font-size: 46px; font-weight: 700; line-height: 1;
    color: #449799;                                   /* @color/main_color */
  }
  p {
    position: relative; margin: 12px 0 0; font-size: 26px; line-height: 1.1;
    color: #B94B55;                                   /* @color/secondary_color */
  }
</style></head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
  <div class="card"><img src="logo_full.png" alt=""></div>
  <h1>תכלית</h1>
  <p>שרשרת החסד והתורה למען ישראל</p>
</body></html>
